<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1115" />
    <title>SoleCare — Oyoq kiyim ta'mirlash boshqaruv tizimi</title>
    <script>
      // Apply theme before React loads to prevent flash of wrong theme
      try {
        var stored = JSON.parse(localStorage.getItem('solecare-ui') || '{}')
        var theme = stored.state?.theme || 'system'
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (isDark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
